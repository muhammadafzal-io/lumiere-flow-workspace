name: Booking completion reminders

# Vercel Hobby: GitHub Actions cron for /api/cron/booking-completions
# Reminds callers who haven't finished their booking-completion form yet, and marks
# links past their expiry window so they surface on the Pending Bookings staff page.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  booking-completions-cron:
    name: Sweep pending booking-completion links
    runs-on: ubuntu-latest
    steps:
      - name: Trigger completion follow-up flow
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.VERCEL_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET in GitHub repository secrets"
            exit 1
          fi
          BASE="${APP_URL:-https://lumiere-flow-workspace-htt1.vercel.app}"
          echo "Calling ${BASE}/api/cron/booking-completions"
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/booking-completions")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          echo "Status: $status"
          echo "Response: $body"
          if [ "$status" != "200" ]; then
            echo "Booking-completions cron failed with status $status"
            exit 1
          fi
          echo "Booking-completions cron completed"
